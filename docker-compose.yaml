services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - OSU_API_PROXY_KEYS=${OSU_API_PROXY_KEYS}

volumes:
  caddy_data:
  caddy_config:
